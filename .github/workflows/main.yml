name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          echo "Repo files:"; ls -la
          F=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts nahi mila. Project files repo mein upload nahi hui."
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          echo "PROJ=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJ }}
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "^e: |What went wrong" -A3 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ${{ env.PROJ }}/build.log
          if-no-files-found: ignore
